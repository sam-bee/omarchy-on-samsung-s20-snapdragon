[Unit]
# NetworkManager probes nl80211 while starting. Keep that generic-netlink
# request behind the fail-closed hardware-prepare wrapper, which establishes
# the only permitted early module set (gpi + i2c_qcom_geni).
Requires=r8q-hardware-prepare.service
After=r8q-hardware-prepare.service

[Service]
# A skipped ConditionPathExists dependency is not a failed Requires edge.
# Refuse to start rather than allowing NM to request cfg80211 before adapter
# preparation has completed.
ExecStartPre=/usr/bin/systemctl is-active --quiet r8q-hardware-prepare.service
# NM may request cfg80211 before the parallel Wi-Fi unit, so prepare its hash too.
ExecStartPre=/usr/bin/modprobe sha256
