# Display blanking only. Linux, USB recovery and Wi-Fi remain running.
# Do not add lock, suspend or hibernate commands on this phone.
general {
    inhibit_sleep = 0
}

listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ monitor = "DSI-1", action = "disable" })'
    # The side-button binding wakes/toggles the screen. No on-resume command:
    # a generic activity wake would race the same button's toggle.
}
